name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        shell: pwsh
        run: npm.cmd --prefix frontend ci

      - name: Type check frontend
        shell: pwsh
        run: npm.cmd --prefix frontend run type-check

      - name: Cargo check
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Prepare bundled FFmpeg
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-ffmpeg.ps1

      - name: Build portable exe
        shell: pwsh
        run: pnpm dlx @tauri-apps/cli build --no-bundle

      - name: Build all-in-one installer
        shell: pwsh
        run: pnpm dlx @tauri-apps/cli build

      - name: Prepare artifacts
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/ai-report-factory.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem src-tauri/target/release -Recurse | Select-Object FullName,Length
            throw "Portable exe not found: $exe"
          }
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found." }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          New-Item -ItemType Directory -Force -Path release-assets/portable/tools/ffmpeg | Out-Null
          Copy-Item $exe "release-assets/AI-Report-Factory-windows-x64.exe"
          Copy-Item $installer.FullName "release-assets/AI-Report-Factory-windows-x64-setup.exe"
          Copy-Item $exe "release-assets/portable/AI-Report-Factory-windows-x64.exe"
          $ffmpegExe = Get-ChildItem "resources/tools/ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ffmpegExe) { throw "ffmpeg.exe not found in downloaded FFmpeg archive." }
          Copy-Item $ffmpegExe.FullName "release-assets/portable/tools/ffmpeg/ffmpeg.exe" -Force
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          @"
          FFmpeg is bundled from BtbN/FFmpeg-Builds latest LGPL Windows build:
          $ffmpegUrl

          FFmpeg is an optional local video composition tool used by AI Report Factory.
          See https://ffmpeg.org/legal.html and the FFmpeg build package for license details.
          "@ | Set-Content "release-assets/portable/tools/ffmpeg/README-FFMPEG.txt"
          if (Test-Path CHANGELOG.md) {
            "# AI Report Factory $env:GITHUB_REF_NAME`n`n" + (Get-Content CHANGELOG.md -Raw) |
              Set-Content release-assets/RELEASE_NOTES.md
          } else {
            "# AI Report Factory $env:GITHUB_REF_NAME`n`nWindows portable exe build." |
              Set-Content release-assets/RELEASE_NOTES.md
          }
          Copy-Item "release-assets/RELEASE_NOTES.md" "release-assets/portable/RELEASE_NOTES.md" -Force
          Compress-Archive -Path "release-assets/portable/*" -DestinationPath "release-assets/AI-Report-Factory-windows-x64-portable.zip" -Force
          Get-FileHash "release-assets/AI-Report-Factory-windows-x64.exe","release-assets/AI-Report-Factory-windows-x64-setup.exe","release-assets/AI-Report-Factory-windows-x64-portable.zip","release-assets/RELEASE_NOTES.md" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content release-assets/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Report-Factory-windows-x64
          path: |
            release-assets/AI-Report-Factory-windows-x64.exe
            release-assets/AI-Report-Factory-windows-x64-setup.exe
            release-assets/AI-Report-Factory-windows-x64-portable.zip
            release-assets/SHA256SUMS.txt
            release-assets/RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/AI-Report-Factory-windows-x64.exe
            release-assets/AI-Report-Factory-windows-x64-setup.exe
            release-assets/AI-Report-Factory-windows-x64-portable.zip
            release-assets/SHA256SUMS.txt
            release-assets/RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
