name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.1. Must match tauri.conf.json version."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            throw "Invalid tag: $env:RELEASE_TAG. Example: v0.2.1"
          }
          $version = $env:RELEASE_TAG.TrimStart("v")
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauri -ne $version) {
            throw "Version mismatch: tag=$env:RELEASE_TAG, tauri.conf.json version=$tauri. Run scripts/release.ps1 first."
          }

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rev-parse $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            git tag $env:RELEASE_TAG
            git push origin $env:RELEASE_TAG
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        shell: pwsh
        run: rustup default stable

      - name: Install frontend dependencies
        shell: pwsh
        run: npm.cmd --prefix frontend ci

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Check before build
        shell: pwsh
        run: |
          python -m compileall backend/app
          npm.cmd --prefix frontend run type-check
          if (-not (Test-Path backend/ai-report-backend.exe)) {
            New-Item -ItemType File -Force backend/ai-report-backend.exe | Out-Null
          }
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        shell: pwsh
        run: npm.cmd --prefix frontend run desktop:build

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" release-assets/
          Get-FileHash release-assets/* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content release-assets/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-report-factory-windows-${{ env.RELEASE_TAG }}
          path: release-assets/*

      - name: Ensure GitHub CLI
        shell: pwsh
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            choco install gh -y --no-progress
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG release-assets/* --clobber
          } else {
            gh release create $env:RELEASE_TAG release-assets/* --title "AI Report Factory $env:RELEASE_TAG" --generate-notes
          }
