[package]
name = "ai-report-factory"
version = "0.2.1"
description = "AI Report Factory Windows desktop application"
authors = ["AI Report Factory"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"
default-run = "ai-report-factory"

[lib]
name = "ai_report_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
