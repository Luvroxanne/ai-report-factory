[package]
name = "ai-report-factory"
version = "0.3.1"
description = "Local-first AI report generation desktop application"
authors = ["AI Report Factory"]
license = "MIT"
repository = "https://github.com/Luvroxanne/ai-report-factory"
edition = "2021"
rust-version = "1.77"
default-run = "ai-report-factory"

[lib]
name = "ai_report_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
zip = "2"
walkdir = "2"
open = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
